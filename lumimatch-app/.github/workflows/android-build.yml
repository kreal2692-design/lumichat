name: Android Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Manuel tetikleme için

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    # ÖNEMLİ: Tüm işlemler lumimatch-app klasörü içinde yapılacak
    defaults:
      run:
        working-directory: lumimatch-app
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'lumimatch-app/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/lumimatch-release-key.keystore

      - name: Create gradle.properties with signing config
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumimatch-release-apk
          path: lumimatch-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Get APK info
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK built successfully!"
            echo "📦 Size: $(du -h $APK_PATH | cut -f1)"
            echo "📍 Path: $APK_PATH"
          fi
